[project]
name = "duckietown-rl"
version = "0.1.0"
description = "RL experiments in the Duckietown driving simulator"
requires-python = ">=3.10"

dependencies = [
    "torch>=2.0.0",
    "numpy>=1.23.0,<2.0",
    "gymnasium[mujoco]>=0.29.0",
    "mujoco>=3.0.0",
    "tqdm>=4.64.0",
    "wandb[media]>=0.19.0",
    "matplotlib>=3.5.0",
    "opencv-python-headless>=4.5.0",
    "ml-collections>=0.1.1",
    "absl-py>=1.0.0",
    "Pillow>=9.0.0",
    "pandas>=1.3.0",
]

[project.optional-dependencies]
dev = ["ipython", "jupyter", "ruff"]

[tool.uv]
package = false

[tool.ruff]
line-length = 100
target-version = "py310"