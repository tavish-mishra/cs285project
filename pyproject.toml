[project]
name = "duckietown-rl"
version = "0.1.0"
description = "RL experiments in the Duckietown driving simulator"
requires-python = ">=3.10"

dependencies = [
    "duckietown-gym-daffy==6.1.34",
    "stable-baselines3>=2.0.0",
    "shimmy>=0.2.1",
    "torch>=2.0.0",
    "numpy>=1.23.0,<2.0",
    "opencv-python-headless>=4.5.0",
    "matplotlib>=3.5.0",
    "tensorboard>=2.10.0",
    "tqdm>=4.64.0",
    "pybullet>=3.2.5",
    "pybullet-gymnasium>=0.0.1",
    "matplotlib>=3.10.8",
    "ml-collections>=1.1.0",
    "modal>=1.3.0.post1",
    "opencv-python<4.12.0.88",
    "torch>=2.9.1",
    "tqdm>=4.67.1",
    "wandb[media]>=0.23.1",
    "gym[classic_control,mujoco,box2d]==0.25.2",
    "numpy<2.0.0",
    'pandas',
    "ogbench>=1.2.0",
    "opencv-python>=4.12.0.88",
    "wandb>=0.23.1"
]

[project.optional-dependencies]
dev = ["ipython", "jupyter", "ruff"]

[tool.uv]
package = false
no-build-isolation-package = ["duckietown-gym-daffy", "jpeg4py"]

[tool.ruff]
line-length = 100
target-version = "py310"